services:
  - type: web
    name: oncosense
    runtime: node
    region: oregon
    plan: free
    buildCommand: node scripts/build.js
    startCommand: node backend/src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.11.0
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: BCRYPT_ROUNDS
        value: "10"

databases:
  - name: oncosense-db
    databaseName: oncosense
    user: oncosense_user
    plan: free
